<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <title>오늘의 할 일(반드시하자)</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #252820;
      --muted: #898b82;
      --line: #e9e9e2;
      --paper: #fff;
      --canvas: #f6f5f1;
      --green: #537653;
      --green-dark: #3e6042;
      --green-soft: #edf2e9;
      --orange: #e9a36c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 52px 22px 64px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 2%, rgba(232, 224, 204, .36), transparent 30rem),
        var(--canvas);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .page { width: min(100%, 720px); margin: 0 auto; }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.04em;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      color: white;
      background: var(--green);
    }

    .brand-mark svg { width: 16px; height: 16px; }

    .today-label {
      padding: 7px 11px;
      border: 1px solid #e6e5dd;
      border-radius: 999px;
      color: #77796f;
      background: rgba(255,255,255,.55);
      font-size: 12px;
      font-weight: 650;
    }

    .intro { margin: 0 0 25px; }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 6vw, 39px);
      font-weight: 760;
      letter-spacing: -.065em;
      line-height: 1.25;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 124px;
      margin-bottom: 18px;
      padding: 22px 25px;
      overflow: hidden;
      border-radius: 18px;
      color: #fff;
      background: var(--green);
      box-shadow: 0 10px 24px rgba(55, 81, 53, .12);
      position: relative;
    }

    .summary::after {
      position: absolute;
      top: -70px;
      right: 80px;
      width: 210px;
      height: 210px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 24px rgba(255,255,255,.035), 0 0 0 50px rgba(255,255,255,.025);
      pointer-events: none;
    }

    .summary-copy { position: relative; z-index: 1; }
    .summary-title { margin: 0 0 7px; font-size: 17px; font-weight: 720; letter-spacing: -.04em; }
    .summary-text { margin: 0; color: rgba(255,255,255,.78); font-size: 13px; }

    .progress-ring {
      --progress: 0deg;
      display: grid;
      flex: 0 0 72px;
      width: 72px;
      height: 72px;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(#f5c99c var(--progress), rgba(255,255,255,.2) var(--progress));
      position: relative;
      z-index: 1;
    }

    .progress-ring::before {
      position: absolute;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--green);
      content: "";
    }

    .progress-value { position: relative; font-size: 15px; font-weight: 750; }

    .todo-card {
      padding: 23px 25px 13px;
      border: 1px solid rgba(231,231,224,.8);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 8px 26px rgba(37, 40, 32, .035);
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .card-heading h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 740;
      letter-spacing: -.04em;
    }

    .task-count { margin-left: 6px; color: #a0a196; font-size: 12px; font-weight: 550; }

    .clear-button {
      padding: 6px 0 6px 8px;
      border: 0;
      color: #999b91;
      background: transparent;
      font-size: 12px;
      cursor: pointer;
    }

    .clear-button:hover:not(:disabled) { color: #a65347; }
    .clear-button:disabled { cursor: default; opacity: .48; }

    .add-form {
      display: flex;
      gap: 9px;
      margin-bottom: 17px;
    }

    .input-wrap {
      display: flex;
      flex: 1;
      align-items: center;
      min-width: 0;
      height: 47px;
      padding: 0 14px;
      border: 1px solid #e8e9e2;
      border-radius: 11px;
      background: #fbfbf9;
      transition: border-color .18s, box-shadow .18s;
    }

    .input-wrap:focus-within {
      border-color: #9aaf91;
      box-shadow: 0 0 0 3px rgba(83,118,83,.09);
    }

    .input-plus { margin-right: 10px; color: #97a28c; font-size: 21px; line-height: 1; }

    .task-input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 14px;
    }

    .task-input::placeholder { color: #b0b2aa; }

    .add-button {
      min-width: 76px;
      padding: 0 17px;
      border: 0;
      border-radius: 11px;
      color: white;
      background: var(--green);
      font-size: 13px;
      font-weight: 680;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: scale(.97); }

    .filters {
      display: flex;
      gap: 5px;
      margin-bottom: 7px;
    }

    .filter-button {
      padding: 7px 11px;
      border: 0;
      border-radius: 8px;
      color: #92948b;
      background: transparent;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-button[aria-pressed="true"] {
      color: var(--green-dark);
      background: var(--green-soft);
      font-weight: 700;
    }

    .task-list { min-height: 105px; }
    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 57px;
      border-bottom: 1px solid #f0f0eb;
      animation: appear .2s ease-out;
    }

    .task-row:last-child { border-bottom: 0; }

    .check-button {
      display: grid;
      flex: 0 0 21px;
      width: 21px;
      height: 21px;
      padding: 0;
      place-items: center;
      border: 1.5px solid #d5d8ce;
      border-radius: 7px;
      color: transparent;
      background: white;
      cursor: pointer;
      transition: .18s ease;
    }

    .check-button:hover { border-color: var(--green); }
    .check-button[aria-checked="true"] {
      border-color: var(--green);
      color: white;
      background: var(--green);
    }
    .check-button svg { width: 13px; height: 13px; }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      color: #41443d;
      font-size: 14px;
      line-height: 1.5;
    }

    .task-row.is-complete .task-text { color: #a5a79e; text-decoration: line-through; }

    .delete-button {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: #b2b4ac;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      transition: .15s;
    }

    .task-row:hover .delete-button,
    .delete-button:focus-visible { color: #a65347; background: #fbf2ef; opacity: 1; }
    .delete-button svg { width: 16px; height: 16px; }

    .empty-state {
      display: flex;
      min-height: 125px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #a1a398;
      text-align: center;
    }

    .empty-icon {
      display: grid;
      width: 38px;
      height: 38px;
      margin-bottom: 9px;
      place-items: center;
      border-radius: 13px;
      color: var(--green);
      background: #f2f5ef;
      font-size: 18px;
    }

    .empty-state p { margin: 0; font-size: 13px; }

    .footer-note {
      margin: 19px 0 0;
      color: #a3a49b;
      font-size: 11px;
      text-align: center;
    }

    @keyframes appear {
      from { transform: translateY(4px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 520px) {
      body { padding: 30px 16px 42px; }
      .topline { margin-bottom: 26px; }
      .todo-card { padding: 20px 17px 10px; }
      .summary { min-height: 112px; padding: 19px; }
      .progress-ring { flex-basis: 64px; width: 64px; height: 64px; }
      .progress-ring::before { width: 52px; height: 52px; }
      .delete-button { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none"><path d="m4.5 10.2 3.4 3.4 7.7-7.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        하루 한 걸음
      </div>
      <span class="today-label" id="date-label"></span>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">YOUR DAY, YOUR PACE</p>
      <h1 id="page-title">오늘의 할 일</h1>
      <p class="subtitle">작은 한 걸음이 모여 오늘을 완성해요.</p>
    </section>

    <section class="summary" aria-label="오늘의 진행 상황">
      <div class="summary-copy">
        <p class="summary-title" id="summary-title">오늘도 좋은 하루예요</p>
        <p class="summary-text" id="summary-text">해야 할 일을 적고 하나씩 시작해 보세요.</p>
      </div>
      <div class="progress-ring" id="progress-ring" role="img" aria-label="완료율 0%">
        <span class="progress-value" id="progress-value">0%</span>
      </div>
    </section>

    <section class="todo-card" aria-labelledby="list-title">
      <div class="card-heading">
        <h2 id="list-title">할 일 목록 <span class="task-count" id="task-count"></span></h2>
        <button class="clear-button" id="clear-completed" type="button" disabled>완료 항목 지우기</button>
      </div>
      <form class="add-form" id="add-form">
        <label class="input-wrap">
          <span class="input-plus" aria-hidden="true">+</span>
          <input class="task-input" id="task-input" type="text" maxlength="120" placeholder="새로운 할 일을 입력하세요" autocomplete="off" aria-label="새로운 할 일">
        </label>
        <button class="add-button" type="submit">추가하기</button>
      </form>
      <nav class="filters" aria-label="할 일 필터">
        <button class="filter-button" type="button" data-filter="all" aria-pressed="true">전체</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">진행 중</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">완료</button>
      </nav>
      <div class="task-list" id="task-list" aria-live="polite"></div>
    </section>
    <p class="footer-note">할 일은 이 기기에 자동으로 저장돼요.</p>
  </main>

  <script>
    (() => {
      const now = new Date();
      const dateKey = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("-");
      const storageKey = `daily-tasks-${dateKey}`;
      const dateLabel = document.getElementById("date-label");
      const taskInput = document.getElementById("task-input");
      const taskList = document.getElementById("task-list");
      const taskCount = document.getElementById("task-count");
      const progressRing = document.getElementById("progress-ring");
      const progressValue = document.getElementById("progress-value");
      const summaryTitle = document.getElementById("summary-title");
      const summaryText = document.getElementById("summary-text");
      const clearCompletedButton = document.getElementById("clear-completed");
      const filters = document.querySelector(".filters");
      let activeFilter = "all";
      let tasks = loadTasks();

      dateLabel.textContent = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric", month: "long", day: "numeric", weekday: "short"
      }).format(now);

      function loadTasks() {
        try {
          const saved = localStorage.getItem(storageKey);
          if (!saved) return [];
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed) || !parsed.every(task =>
            task && typeof task.id === "string" &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean"
          )) {
            throw new Error("저장된 할 일 데이터 형식이 올바르지 않습니다.");
          }
          return parsed;
        } catch (error) {
          console.error("오늘의 할 일을 불러오지 못했습니다.", error);
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(tasks));
        } catch (error) {
          console.error("오늘의 할 일을 저장하지 못했습니다.", error);
          window.alert("할 일을 저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.");
        }
      }

      function render() {
        const completed = tasks.filter(task => task.completed).length;
        const total = tasks.length;
        const percentage = total ? Math.round((completed / total) * 100) : 0;
        taskCount.textContent = `${completed}/${total} 완료`;
        progressValue.textContent = `${percentage}%`;
        progressRing.style.setProperty("--progress", `${percentage * 3.6}deg`);
        progressRing.setAttribute("aria-label", `완료율 ${percentage}%`);
        clearCompletedButton.disabled = completed === 0;

        if (total === 0) {
          summaryTitle.textContent = "오늘도 좋은 하루예요";
          summaryText.textContent = "해야 할 일을 적고 하나씩 시작해 보세요.";
        } else if (completed === total) {
          summaryTitle.textContent = "오늘 할 일을 모두 마쳤어요!";
          summaryText.textContent = "멋져요. 오늘의 수고를 충분히 칭찬해 주세요.";
        } else {
          summaryTitle.textContent = "좋은 흐름이에요";
          summaryText.textContent = `오늘 할 일 ${total - completed}개가 남았어요. 천천히 해봐요.`;
        }

        const visibleTasks = tasks.filter(task =>
          activeFilter === "all" ||
          (activeFilter === "active" && !task.completed) ||
          (activeFilter === "completed" && task.completed)
        );
        taskList.replaceChildren();

        if (visibleTasks.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          const icon = document.createElement("span");
          icon.className = "empty-icon";
          icon.setAttribute("aria-hidden", "true");
          icon.textContent = activeFilter === "completed" ? "✓" : "＋";
          const message = document.createElement("p");
          message.textContent = activeFilter === "completed"
            ? "아직 완료한 할 일이 없어요."
            : activeFilter === "active" && total > 0
              ? "진행 중인 할 일이 없어요."
              : "할 일을 추가하고 오늘을 시작해 보세요.";
          empty.append(icon, message);
          taskList.append(empty);
          return;
        }

        visibleTasks.forEach(task => {
          const row = document.createElement("div");
          row.className = `task-row${task.completed ? " is-complete" : ""}`;
          const check = document.createElement("button");
          check.className = "check-button";
          check.type = "button";
          check.setAttribute("role", "checkbox");
          check.setAttribute("aria-checked", String(task.completed));
          check.setAttribute("aria-label", `${task.text} ${task.completed ? "완료 취소" : "완료"}`);
          check.innerHTML = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8.2 2.8 2.8 6.2-6.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          check.addEventListener("click", () => {
            task.completed = !task.completed;
            saveTasks();
            render();
          });

          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;
          const remove = document.createElement("button");
          remove.className = "delete-button";
          remove.type = "button";
          remove.setAttribute("aria-label", `${task.text} 삭제`);
          remove.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 6h10m-8.5 0 .6 10h5.8l.6-10M8 6V4h4v2m-3 3v4m2-4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          remove.addEventListener("click", () => {
            tasks = tasks.filter(item => item.id !== task.id);
            saveTasks();
            render();
          });

          row.append(check, text, remove);
          taskList.append(row);
        });
      }

      document.getElementById("add-form").addEventListener("submit", event => {
        event.preventDefault();
        const text = taskInput.value.trim();
        if (!text) {
          taskInput.focus();
          return;
        }
        tasks.unshift({ id: crypto.randomUUID(), text, completed: false });
        saveTasks();
        taskInput.value = "";
        activeFilter = "all";
        filters.querySelectorAll(".filter-button").forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter));
        });
        render();
        taskInput.focus();
      });

      filters.addEventListener("click", event => {
        const button = event.target.closest("[data-filter]");
        if (!button) return;
        activeFilter = button.dataset.filter;
        filters.querySelectorAll(".filter-button").forEach(filterButton => {
          filterButton.setAttribute("aria-pressed", String(filterButton === button));
        });
        render();
      });

      clearCompletedButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
